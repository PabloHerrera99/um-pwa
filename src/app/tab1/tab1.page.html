<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="cargar($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (cargando()) {
    <div class="ion-text-center ion-padding"><ion-spinner></ion-spinner></div>
  }

  @if (error()) {
    <ion-text color="danger"><p class="ion-padding">{{ error() }}</p></ion-text>
  }

  <ion-list>
    @for (p of productos(); track p.id) {
      <ion-item>
        <ion-label>
          <h2>{{ p.nombre }}</h2>
          <p>{{ p.precio | currency:'ARS':'symbol-narrow':'1.0-0' }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
